apiVersion: apps/v1
kind: Deployment
metadata:
  name: marketmate
  namespace: marketmate
spec:
  replicas: 2
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: marketmate
  template:
    metadata:
      labels:
        app: marketmate
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: app
          image: marketmate-devops:local
          imagePullPolicy: IfNotPresent
          lifecycle:
            preStop:
              exec:
                command: ["sh", "-c", "sleep 5"] #?
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: marketmate-config
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
