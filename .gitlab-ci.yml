stages:
  - test
  - sonarqube
  - build
  - deploy


workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - when: never

variables:
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  IMAGE_REF: "$DOCKER_REGISTRY/task:$CI_COMMIT_SHORT_SHA"


unit_test:
  stage: test
  image: python:3.12-slim-bookworm
  cache:
    paths:
       - .cache/pip/
  script:
    - pip install -r requirements-dev.txt
    - python -m pytest --cov=app --cov-report=xml:coverage.xml -q
  artifacts:
    paths:
      - coverage.xml
    expire_in: 1 day

sonarqube_check:
  stage: sonarqube
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]

  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"  # Defines the location of the analysis task cache
    GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project, required by the analysis task
  cache:
    key: "$CI_JOB_NAME"
    paths:
      - .sonar/cache

  dependencies:
    - unit_test

  script:
    - sonar-scanner -Dsonar.qualitygate.wait=true

  allow_failure: false


build_and_push:
  stage: build
  image: docker:29-cli
  services:
    - name: docker:29-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: /certs
    DOCKER_TLS_VERIFY: "1"
    DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  before_script:
    - echo "$DOCKER_PASS" | docker login "$DOCKER_REGISTRY" -u "$DOCKER_USERNAME" --password-stdin
  script:
    - docker build -t "$IMAGE_REF" .
    - docker push "$IMAGE_REF"
  after_script:
    - docker logout "$DOCKER_REGISTRY" || true

# Deploy jobs need SSH_PRIVATE_KEY (file-type), SSH_KNOWN_HOSTS (file-type),
# STAGING_HOST and PRODUCTION_HOST, STAGING_SSH_USER and PRODUCTION_SSH_USER.
.deploy_template:
  image: alpine:3.24
  interruptible: false
  before_script:
    - apk add --no-cache openssh-client
    - test -s "$SSH_PRIVATE_KEY"
    - test -s "$SSH_KNOWN_HOSTS"
    - chmod 600 "$SSH_PRIVATE_KEY"
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - cp "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - chmod 600 ~/.ssh/known_hosts
  script:
    - |
      case "$DEPLOY_ENV" in
        staging) HOST="$STAGING_HOST"; SSH_USER="$STAGING_SSH_USER" ;;
        production) HOST="$PRODUCTION_HOST"; SSH_USER="$PRODUCTION_SSH_USER" ;;
        *) exit 2 ;;
      esac
      test -n "$HOST" && test -n "$SSH_USER"
      # Trust is pinned using an operator-reviewed known_hosts file; no ssh-keyscan in CI.
      ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$SSH_PRIVATE_KEY" \
        "$SSH_USER@$HOST" \
        "cd /opt/marketmate && bash ./script/deploy_remote.sh '$DEPLOY_ENV' '$IMAGE_REF'"

staging:
  stage: deploy
  extends: .deploy_template
  variables:
    DEPLOY_ENV: staging
  environment:
    name: staging
  resource_group: staging
  needs:
    - build_and_push


production:
  stage: deploy
  extends: .deploy_template
  variables:
    DEPLOY_ENV: production
  environment:
    name: production
  resource_group: production
  needs:
    - build_and_push
    - staging
  when: manual
  allow_failure: false
