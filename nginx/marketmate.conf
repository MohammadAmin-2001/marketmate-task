# On the HOST nginx (not inside Docker). Substitute your domain and configure TLS.
upstream marketmate_backend {
    server 127.0.0.1:8000;
}
server {
    listen 80;
    server_name marketmate.example.com;
    location / {
        proxy_pass http://marketmate_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    # Restrict Prometheus endpoint at network and/or reverse-proxy layer.
    location = /metrics { return 403; }
}
